# Update pull requests: the workflows' pinned actions weekly; Rust crates
# and npm packages monthly, grouped into one pull request each.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # svelte-check 4.x accepts only TypeScript ^5 || ^6 as a peer; a
      # TypeScript 7 bump breaks `npm ci` (ERESOLVE). Lift this once
      # svelte-check supports TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
