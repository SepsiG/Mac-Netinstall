# On a version tag (v0.1.0, ...): test, build the .dmg (named without
# spaces: Mac-Netinstall_<version>_aarch64.dmg), publish its SHA-256, and
# create a *draft* GitHub Release with both, its notes taken from the
# CHANGELOG.md section of that version (a version with "-", e.g.
# 0.2.0-rc.1, is marked as a pre-release). Review and publish the draft
# by hand.
#
# Two jobs: `build` runs the repository's code with a read-only token;
# only `publish`, which runs no repository code (it downloads the build's
# artifact), may write.
#
# The build is ad-hoc signed (bundle.macOS.signingIdentity "-"); no signing
# secrets are used. See "Future: Developer ID signing and notarization" below.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Test and build the DMG
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag, versions and changelog agree
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          app=$(node -p "require('./app/package.json').version")
          conf=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          cargo=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          echo "tag $version, package.json $app, tauri.conf.json $conf, Cargo.toml $cargo"
          if [ "$version" != "$app" ] || [ "$version" != "$conf" ] || [ "$version" != "$cargo" ]; then
            echo "::error::the tag does not match the versions in the repository" >&2
            exit 1
          fi
          # The notes: the "## [x.y.z]" section, up to the next section or
          # the link references at the bottom.
          mkdir -p "$RUNNER_TEMP/dist"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]*\]: / { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/dist/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/dist/notes.md"; then
            echo "::error::CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Rust toolchain
        run: rustup toolchain install --no-self-update && rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release
      # The same tests as CI (hardware tests skip where CI is set).
      - name: cargo test
        run: cargo test --workspace
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app

      # CI=true skips the Finder AppleScript (DMG window layout), which
      # needs Automation permission: the DMG holds the app and the
      # Applications link in Finder's default layout.
      - name: tauri build
        working-directory: app
        run: npx tauri build --target aarch64-apple-darwin --bundles app,dmg
        env:
          CI: "true"
          # Future: Developer ID signing and notarization. Add these
          # repository secrets, set bundle.macOS.signingIdentity to the
          # "Developer ID Application: ..." identity (or pass it here as
          # APPLE_SIGNING_IDENTITY) and uncomment; Tauri then signs with
          # the certificate and notarizes with the Apple ID (or use
          # APPLE_API_KEY / APPLE_API_ISSUER / APPLE_API_KEY_PATH instead).
          # Check MAC address masking with the Developer ID build before
          # switching (see the roadmap, "MAC masking in the bundle").
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}                   # base64 .p12
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}                         # app-specific password
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: DMG without spaces, and its SHA-256
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dist="$RUNNER_TEMP/dist"
          name="Mac-Netinstall_${VERSION}_aarch64.dmg"
          cp "target/aarch64-apple-darwin/release/bundle/dmg/Mac Netinstall_${VERSION}_aarch64.dmg" "$dist/$name"
          cd "$dist"
          shasum -a 256 "$name" > "$name.sha256"
          shasum -a 256 -c "$name.sha256"
          ls -l

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Draft the GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the draft release and upload its assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Check the assets
        working-directory: dist
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          name="Mac-Netinstall_${VERSION}_aarch64.dmg"
          ls -l
          # Exactly the DMG, its checksum and the notes; names without spaces.
          [ "$(ls | sort | tr '\n' ' ')" = "$name $name.sha256 notes.md " ]
          sha256sum -c "$name.sha256"

      - name: Draft release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          name="Mac-Netinstall_${VERSION}_aarch64.dmg"
          prerelease=()
          case "$VERSION" in
            *-*) prerelease=(--prerelease) ;;
          esac
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            "${prerelease[@]}" \
            --title "Mac Netinstall $VERSION" \
            --notes-file notes.md \
            "$name" "$name.sha256"
