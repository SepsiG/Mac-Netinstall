[workspace]
resolver = "2"
members = [
    "crates/ni-proto",
    "crates/ni-sim",
    "crates/ni-net",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.80"

[workspace.dependencies]
bytes = "1"
thiserror = "2"
proptest = "1"
nix = { version = "0.31.3", default-features = false }
socket2 = "0.6.5"
tokio = "1.54.1"
ni-proto = { path = "crates/ni-proto" }
ni-net = { path = "crates/ni-net" }
