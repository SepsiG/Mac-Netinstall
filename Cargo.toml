[workspace]
resolver = "2"
members = [
    "crates/ni-proto",
    "crates/ni-sim",
    "crates/ni-net",
    "crates/ni-bootp",
    "crates/ni-tftp",
    "crates/ni-assets",
    "crates/ni-engine",
    "crates/ni-cli",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.88"

[workspace.dependencies]
bytes = "1"
thiserror = "2"
proptest = "1"
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"
nix = { version = "0.31.3", default-features = false }
socket2 = "0.6.5"
system-configuration = "0.8.0"
tokio = "1.54.1"
reqwest = { version = "0.13.5", default-features = false }
flate2 = "1.1.11"
tar = "0.4.46"
sha2 = "0.11.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false }
clap = "4.6.7"
tauri = "2.12.5"
tauri-build = "2.7.4"
tauri-plugin-dialog = "2.8.4"
ni-proto = { path = "crates/ni-proto" }
ni-net = { path = "crates/ni-net" }
ni-bootp = { path = "crates/ni-bootp" }
ni-tftp = { path = "crates/ni-tftp" }
ni-sim = { path = "crates/ni-sim" }
ni-assets = { path = "crates/ni-assets" }
ni-engine = { path = "crates/ni-engine" }
