[package]
name = "ni-assets"
description = "Boot kernels and RouterOS packages: download, verify, extract, cache"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bytes.workspace = true
flate2.workspace = true
ni-bootp.workspace = true
ni-proto.workspace = true
nix = { workspace = true, features = ["fs"] }
reqwest = { workspace = true, features = ["rustls"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "rt", "sync"] }

[features]
# Exposes `ni_assets::testutil` (fake mirror, synthetic files) to other
# crates' tests. Never enable it in a shipping binary.
testing = ["tokio/macros", "tokio/net", "tokio/time"]

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "net", "time"] }
