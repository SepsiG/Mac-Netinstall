[package]
name = "ni-engine"
description = "Netinstall orchestration: devices, profiles, auto-repeat, preflight, events"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bytes.workspace = true
ni-assets.workspace = true
ni-bootp.workspace = true
ni-net.workspace = true
ni-proto.workspace = true
ni-tftp.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
ni-assets = { workspace = true, features = ["testing"] }
ni-sim = { workspace = true, features = ["lan"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
