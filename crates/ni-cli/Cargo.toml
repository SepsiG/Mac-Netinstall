[package]
name = "ni-cli"
description = "Command-line MikroTik Netinstall for macOS"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "ni-cli"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive", "env"] }
ni-assets.workspace = true
ni-engine.workspace = true
ni-net.workspace = true
ni-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "std"] }

[dev-dependencies]
ni-assets = { workspace = true, features = ["testing"] }
ni-sim = { workspace = true, features = ["lan"] }
tokio = { workspace = true, features = ["io-util", "net", "process"] }
