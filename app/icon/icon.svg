<?xml version="1.0" encoding="UTF-8"?>
<!--
  Mac Netinstall app icon (source of truth). SPDX-License-Identifier: GPL-3.0-only
  macOS (Big Sur+) grid: 1024 canvas, 824 x 824 continuous-corner body at
  (100, 100) with a soft drop shadow. Motif: a network device with Ethernet
  ports and a patch cable, and an arrow flashing software into it.
  Rendered by app/scripts/make-icon.mjs; icon-small.svg is the 16-64 px variant.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <path id="body" d="M627.36 100 c103.83 0 155.75 0 195.41 20.21 a185.4 185.4 0 0 1 81.02 81.02 c20.21 39.66 20.21 91.58 20.21 195.41 L924 627.36 c0 103.83 0 155.75 -20.21 195.41 a185.4 185.4 0 0 1 -81.02 81.02 c-39.66 20.21 -91.58 20.21 -195.41 20.21 L396.64 924 c-103.83 0 -155.75 0 -195.41 -20.21 a185.4 185.4 0 0 1 -81.02 -81.02 c-20.21 -39.66 -20.21 -91.58 -20.21 -195.41 L100 396.64 c0 -103.83 0 -155.75 20.21 -195.41 a185.4 185.4 0 0 1 81.02 -81.02 c39.66 -20.21 91.58 -20.21 195.41 -20.21 Z"/>
    <clipPath id="clip"><use href="#body"/></clipPath>

    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#3CC4F5"/>
      <stop offset="0.55" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#3B2BB8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="300" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="port" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="plug" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E2E8F0"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CBD5E1"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B1B4D" flood-opacity="0.45"/>
    </filter>
    <filter id="blur" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Body -->
  <use href="#body" fill="url(#bg)" filter="url(#shadow)"/>
  <g clip-path="url(#clip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>

    <!-- Patch cable: out of the right-most port, down and out of the body -->
    <path d="M688 800 C688 880 760 872 840 900 S930 960 960 1000" fill="none"
          stroke="#0F2A6B" stroke-opacity="0.35" stroke-width="44" stroke-linecap="round" filter="url(#blur)"/>
    <path d="M688 790 C688 870 752 866 830 892 S920 950 950 1000" fill="none"
          stroke="#FBBF24" stroke-width="34" stroke-linecap="round"/>
    <path d="M688 790 C688 870 752 866 830 892 S920 950 950 1000" fill="none"
          stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="8" stroke-linecap="round" transform="translate(-8 -4)"/>
  </g>

  <!-- Ground shadow of the device -->
  <ellipse cx="512" cy="776" rx="310" ry="26" fill="#0B1B4D" opacity="0.45" filter="url(#blur)"/>

  <!-- Device -->
  <rect x="216" y="552" width="592" height="216" rx="44" fill="url(#front)" filter="url(#soft)"/>
  <path d="M260 552 H764 Q808 552 808 596 V600 H216 V596 Q216 552 260 552 Z" fill="url(#top)"/>
  <rect x="216" y="598" width="592" height="4" fill="#94A3B8" opacity="0.45"/>
  <rect x="218" y="554" width="588" height="212" rx="42" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="3"/>

  <!-- Status LEDs -->
  <circle cx="270" cy="640" r="11" fill="#22C55E"/>
  <circle cx="270" cy="640" r="4.5" fill="#DCFCE7"/>
  <circle cx="270" cy="690" r="11" fill="#F59E0B"/>
  <circle cx="270" cy="690" r="4.5" fill="#FEF3C7"/>

  <!-- Ethernet ports (RJ45: a socket with the latch notch at the bottom) -->
  <g fill="url(#port)">
    <path d="M330 628 H418 V708 H394 V720 H354 V708 H330 Z"/>
    <path d="M442 628 H530 V708 H506 V720 H466 V708 H442 Z"/>
    <path d="M554 628 H642 V708 H618 V720 H578 V708 H554 Z"/>
    <path d="M666 628 H754 V708 H730 V720 H690 V708 H666 Z"/>
  </g>
  <!-- Port contacts -->
  <g fill="#FCD34D" opacity="0.9">
    <rect x="344" y="636" width="60" height="9" rx="2"/>
    <rect x="456" y="636" width="60" height="9" rx="2"/>
    <rect x="568" y="636" width="60" height="9" rx="2"/>
  </g>

  <!-- Plug in the right-most port -->
  <path d="M672 640 H748 V776 Q748 800 724 800 H696 Q672 800 672 776 Z" fill="url(#plug)"/>
  <rect x="684" y="700" width="52" height="10" rx="5" fill="#94A3B8"/>
  <rect x="684" y="724" width="52" height="10" rx="5" fill="#94A3B8"/>
  <rect x="680" y="788" width="60" height="22" rx="8" fill="#F59E0B"/>

  <!-- Install arrow into the device -->
  <g filter="url(#soft)">
    <path d="M512 538 L372 386 Q362 372 380 372 H460 V214 Q460 188 486 188 H538 Q564 188 564 214 V372 H644 Q662 372 652 386 Z"
          fill="url(#arrow)"/>
  </g>
  <path d="M478 214 Q478 204 488 204 H500 V372 H478 Z" fill="#FFFFFF" opacity="0.45"/>
</svg>
